[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-agentic-ai-platform"
version = "0.1.0"
description = "Self-directed reference for a simulated healthcare agent platform. Drafts only. No live EHR or clinical validation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jatinder Singh" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2",
  "sqlalchemy>=2",
  "langgraph>=0.2.60",
  "mlflow>=2.16",
  "opentelemetry-api>=1.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
healthcare-platform = "healthcare_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["healthcare_platform"]
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
