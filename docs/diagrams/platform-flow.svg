  <text x="52" y="132" fill="#102033" font-family="Segoe UI, sans-serif" font-size="16">Clinical document drafts</text>
  <text x="52" y="156" fill="#5c6b7a" font-family="Segoe UI, sans-serif" font-size="13">Draft note · no record write</text>
  <rect x="364" y="100" width="312" height="92" rx="8" fill="#d9e3ec"/>
  <rect x="360" y="96" width="312" height="92" rx="8" fill="#ffffff" stroke="#e1e8ef"/>
