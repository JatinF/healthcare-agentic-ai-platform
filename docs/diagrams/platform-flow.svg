<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640">
  <rect width="1040" height="640" fill="#f4f7fb"/>
  <rect width="1040" height="72" fill="#101820"/>
  <text x="32" y="36" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="22">Healthcare agent platform</text>
  <text x="32" y="58" fill="#c5d0da" font-family="Segoe UI, sans-serif" font-size="13">Synthetic drafts · one runtime · no EHR</text>
  <rect x="36" y="100" width="312" height="92" rx="8" fill="#d9e3ec"/>
  <rect x="32" y="96" width="312" height="92" rx="8" fill="#ffffff" stroke="#e1e8ef"/>
